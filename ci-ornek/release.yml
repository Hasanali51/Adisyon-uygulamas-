name: Release (Windows)

# "v1.3.0" gibi bir etiket push'landığında Windows kurulum dosyasını derler ve
# GitHub'da release olarak yayınlar. Elle de çalıştırılabilir (Actions sekmesi → Run workflow).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-win:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: masaustu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: masaustu/package-lock.json
      - run: npm ci
      - name: Derle ve release olarak yayınla
        run: npx electron-builder --win nsis --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
